# =============================================================================
# 🚀 PIPELINE CI/CD PRINCIPAL — BOOKWORM BACKEND
# =============================================================================
# Descripción: Pipeline completo de Integración Continua y Despliegue Continuo.
# Flujo de ramas: dev → test → main
#
# IMPORTANTE: Este pipeline SOLO se ejecuta cuando el código llega a la
# rama test (push directo o merge de PR). NO se ejecuta en dev.
#
# Jobs del pipeline:
#   1. build          → Compilación del proyecto
#   2. unit-tests     → Tests unitarios con JUnit 5 + Mockito + JaCoCo
#   3. integration-tests → Tests de integración con Testcontainers + PostgreSQL
#   4. code-quality   → Análisis con SonarCloud (Quality Gate)
#   5. security-scan  → Escaneo OWASP Dependency-Check (SCA)
#   6. docker-build   → Construcción y publicación de imagen Docker
#   7. deploy-staging → Despliegue simulado al entorno de pruebas
# =============================================================================

name: "🔄 CI/CD Pipeline — Bookworm Backend"

# ======================== TRIGGERS (Disparadores) ========================
# SOLO se ejecuta en la rama test:
#   - Cuando se hace push directo a test
#   - Cuando se abre/actualiza un PR que apunta HACIA test
# NO se ejecuta en dev ni en main directamente.

on:
  push:
    branches:
      - test
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

  pull_request:
    branches:
      - test
    types: [opened, synchronize, reopened]

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "temurin"
  DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository }}
  DOCKER_PLATFORMS: linux/amd64
  MAVEN_OPTS: "-Xmx1024m -XX:MaxMetaspaceSize=512m"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: write

jobs:
  build:
    name: "🔨 Compilación"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "☕ Configurar JDK"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "🔧 Compilar y empaquetar sin tests"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: "📤 Subir artefacto JAR"
        uses: actions/upload-artifact@v4
        with:
          name: bookworm-jar
          path: target/*.jar
          retention-days: 1
          if-no-files-found: error

  unit-tests:
    name: "🧪 Tests Unitarios"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Configurar JDK"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "▶️ Ejecutar tests unitarios"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: "📤 Subir reporte JaCoCo"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            target/jacoco.xml
          retention-days: 5
          if-no-files-found: ignore

      - name: "📤 Subir resultados unitarios"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: target/surefire-reports/
          retention-days: 5
          if-no-files-found: ignore

  integration-tests:
    name: "🔗 Tests de Integración"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Configurar JDK"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "▶️ Ejecutar tests de integración"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} failsafe:integration-test failsafe:verify
        env:
          SPRING_PROFILES_ACTIVE: integration
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: "📤 Subir resultados integración"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: target/failsafe-reports/
          retention-days: 5
          if-no-files-found: ignore

  code-quality:
    name: "📊 Calidad de Código (SonarCloud)"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "☕ Configurar JDK"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "📥 Descargar reporte JaCoCo"
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
        continue-on-error: true

      - name: "💾 Cache SonarCloud"
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            sonar-${{ runner.os }}-

      - name: "🔍 Ejecutar SonarCloud"
        run: >
          mvn ${{ env.MAVEN_CLI_OPTS }} sonar:sonar
          -DskipTests
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.java.coveragePlugin=jacoco
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-scan:
    name: "🛡️ Escaneo de Seguridad (OWASP)"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Configurar JDK"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "💾 Cache NVD"
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: "🔍 Ejecutar OWASP Dependency-Check"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} verify -Powasp -DskipTests
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: "📤 Subir reporte OWASP"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-security-report
          path: target/owasp-reports/
          retention-days: 30
          if-no-files-found: ignore

  docker-build:
    name: "🐳 Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔧 Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 Login a GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Extraer metadatos"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=test-latest

      - name: "🏗️ Build & Push"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.DOCKER_PLATFORMS }}

  docker-validate:
    name: "🐳 Validar Dockerfile"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  deploy-staging:
    name: "🚀 Despliegue a Staging"
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    environment:
      name: staging
      url: https://staging.bookworm.example.com

    steps:
      - name: "🚀 Desplegar a Staging"
        run: |
          echo "============================================="
          echo "🚀 DESPLIEGUE A STAGING"
          echo "============================================="
          echo "📦 Imagen Docker: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}"
          echo "🌿 Rama: ${{ github.ref_name }}"
          echo "👤 Autor: ${{ github.actor }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "⏰ Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================="
          echo "✅ Despliegue simulado completado exitosamente."

      - name: "✅ Smoke test post-despliegue"
        run: |
          echo "🔍 Ejecutando smoke test simulado..."
          echo "   → GET /actuator/health ... OK"
          echo "   → GET /swagger-ui.html ... OK"
          echo "   → POST /api/auth/register ... OK"
          echo "✅ Smoke tests completados exitosamente."

      - name: "📣 Resumen del despliegue"
        run: |
          echo "## 🚀 Despliegue a Staging Exitoso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detalle | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen | \`${{ env.DOCKER_IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fecha | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
