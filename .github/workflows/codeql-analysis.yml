# =============================================================================
# 🔐 ANÁLISIS SAST CON GITHUB CodeQL
# =============================================================================
# Descripción: Escaneo de seguridad estática (SAST) del código fuente Java.
# SOLO se ejecuta en la rama test (push/PR) y semanalmente (cron).
# =============================================================================
name: "🔐 CodeQL Security Analysis"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-analysis:
    name: "🔍 Análisis CodeQL (Java)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Configurar JDK 25"
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: "🔧 Inicializar CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: "🔨 Auto-build del proyecto"
        uses: github/codeql-action/autobuild@v4

      - name: "🔍 Ejecutar análisis CodeQL"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"