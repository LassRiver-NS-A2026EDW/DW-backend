# =============================================================================
# 🔐 ANÁLISIS SAST CON GITHUB CodeQL
# =============================================================================
# Descripción: Escaneo de seguridad estática (SAST) del código fuente Java.
# SOLO se ejecuta en la rama test (push/PR) y semanalmente (cron).
# =============================================================================

name: "🔐 CodeQL Security Analysis"

# ======================== TRIGGERS ========================
on:
  # SOLO en la rama test
  push:
    branches:
      - 'test'
    paths-ignore:
      - "**.md"
      - "docs/**"

  pull_request:
    branches:
      - 'test'

  # Ejecución programada semanal
  schedule:
    - cron: "0 6 * * 1"

# ======================== PERMISOS ========================
permissions:
  actions: read
  contents: read
  security-events: write

# ======================== JOBS ========================
jobs:
  codeql-analysis:
    name: "🔍 Análisis CodeQL (Java)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]

    steps:
      - name: "📥 Checkout del código fuente"
        uses: actions/checkout@v4

      # Usar Java 21 LTS (disponible y compatible)
      - name: "☕ Configurar JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: "🔧 Permisos para Maven Wrapper"
        run: chmod +x ./mvnw

      - name: "🔧 Inicializar CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: "🔨 Auto-build del proyecto"
        uses: github/codeql-action/autobuild@v3

      - name: "🔍 Ejecutar análisis CodeQL"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
