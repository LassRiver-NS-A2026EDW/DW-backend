spring:
  profiles:
    active: dev # Perfil activo por defecto
  config:
    import: optional:file:env.properties
  security:
    user:
      name: admin
      password: 1234
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookworm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate # Flyway se encarga de la estructura
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    '[org.springframework.security]': DEBUG
    '[org.hibernate.SQL]': DEBUG

# Configuración para Swagger / OpenAPI (HU-T02-04)
springdoc:
  swagger-ui:
    path: /swagger-ui.html

bookworm:
  storage:
    pdf-dir: ${BOOKWORM_PDF_DIR:uploads/pdfs}
    max-pdf-bytes: ${BOOKWORM_MAX_PDF_BYTES:52428800}
    allowed-pdf-hosts: ${BOOKWORM_ALLOWED_PDF_HOSTS:}
  ai:
    base-url: ${BOOKWORM_AI_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${BOOKWORM_AI_MODEL:deepseek-v4-flash}

