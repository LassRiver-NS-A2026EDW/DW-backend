spring:
  profiles:
    active: dev # Aquí defines qué perfil usar (HU-T03-02)

---
spring:
  config:
    activate:
      on-profile: dev
  security:
    user:
      name: admin
      password: 1234
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/bookworm_db
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: validate # Flyway se encarga de la estructura
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  

logging:
    level:
      '[org.springframework.security]': DEBUG
      '[org.hibernate.SQL]': DEBUG
# Configuración para Swagger / OpenAPI (HU-T02-04)
springdoc:
  swagger-ui:
    path: /swagger-ui.html